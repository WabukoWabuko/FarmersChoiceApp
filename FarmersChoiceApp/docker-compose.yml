services:
  farmers-choice:
    build: .
    restart: unless-stopped
    ports:
      - "8550:8550"
    environment:
      PORT: 8550
      DATABASE_PATH: /data/user_data.db
      RECOMMENDATION_DATABASE_PATH: /data/recommendation_data.db
    volumes:
      - farmers_choice_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8550', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  farmers_choice_data:
